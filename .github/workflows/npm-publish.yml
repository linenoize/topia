name: Publish to npm

# Publishes @linenoize/topia to the npm registry.
#
# Trigger: push a version tag, e.g.
#     git tag v3.2.2 && git push origin v3.2.2
#
# One-time setup:
#   1. npmjs.com -> Access Tokens -> Generate New -> "Automation"
#      (Automation tokens bypass 2FA for publish; Classic/Publish tokens do not.)
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret named NPM_TOKEN with that token.
#
# Manual dry run (no publish) is available via the "Run workflow" button
# on the Actions tab (workflow_dispatch, dry_run defaults to true).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (npm publish --dry-run, no registry write)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm --provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump package.json (and plugin.json/marketplace.json) or retag."
            exit 1
          fi
          echo "Tag and package.json agree on v$PKG"

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --provenance --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
