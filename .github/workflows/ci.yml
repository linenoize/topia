name: CI

# Push/PR gate. Runs the full local CI bundle (lint + tests + signal
# validation + doctor) on both Linux and Windows so the recurring
# Windows/Cursor hook regressions become pre-merge failures. The conformance
# harness (compiler/__tests__/hook-conformance.test.js) is the centerpiece.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    name: ci (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Lockfile is committed so the toolchain (esp. biome) is pinned and CI
      # can't drift to a newer formatter/linter than developers run locally.
      - run: npm ci
      - run: npm run ci
